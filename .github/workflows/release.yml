name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: GazeFlow-Windows
            archive_cmd: powershell -Command "Compress-Archive -Path dist/GazeFlow/* -DestinationPath GazeFlow-Windows.zip"
            archive_file: GazeFlow-Windows.zip
          - os: macos-latest
            asset_name: GazeFlow-macOS
            archive_cmd: cd dist && tar -czf ../GazeFlow-macOS.tar.gz GazeFlow && cd ..
            archive_file: GazeFlow-macOS.tar.gz
          - os: ubuntu-latest
            asset_name: GazeFlow-Linux
            archive_cmd: cd dist && tar -czf ../GazeFlow-Linux.tar.gz GazeFlow && cd ..
            archive_file: GazeFlow-Linux.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build standalone executable
        run: pyinstaller gazeflow.spec --noconfirm

      - name: Package build
        run: ${{ matrix.archive_cmd }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
