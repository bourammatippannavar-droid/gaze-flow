name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux GUI/display deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk scrot

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run headless self-test (Linux, with virtual display)
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python main.py --headless-self-test

      - name: Run headless self-test (Windows/macOS)
        if: runner.os != 'Linux'
        run: |
          python main.py --headless-self-test

      - name: Byte-compile all modules
        run: |
          python -c "import py_compile, glob; [py_compile.compile(f, doraise=True) for f in glob.glob('gazeflow/*.py') + ['main.py']]"
